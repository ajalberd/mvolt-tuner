[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvolt-tuner"
version = "0.1.0"
description = "Automatic GPU tuning for mVolt+ and MSI Kombustor, with a crash-safe trial journal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mvolt-tuner contributors" }]
keywords = ["gpu", "overclock", "undervolt", "nvapi", "kombustor", "mvolt"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.scripts]
mvolt-tuner = "tuner.orchestrator:main"

[project.urls]
Homepage = "https://github.com/OWNER/mvolt-tuner"
Issues = "https://github.com/OWNER/mvolt-tuner/issues"

[tool.setuptools.packages.find]
include = ["tuner*"]

[tool.ruff]
line-length = 100
target-version = "py310"
